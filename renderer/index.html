<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kids Chores</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- HOME VIEW -->
  <div id="view-home" class="view active">
    <div class="header">
      <h1>⭐ Chore Stars ⭐</h1>
      <div class="header-buttons">
        <button class="btn btn-settings" id="btn-manage">Manage Kids</button>
        <button class="btn btn-reset" id="btn-reset">Reset Week</button>
      </div>
    </div>
    <div id="kids-list" class="kids-list"></div>
    <div id="empty-home" class="empty-state hidden">
      <p>No kids yet! Tap "Manage Kids" to get started.</p>
    </div>
  </div>

  <!-- KID CHORES VIEW -->
  <div id="view-kid" class="view">
    <div class="header">
      <button class="btn btn-back" id="btn-back">← Back</button>
      <h1 id="kid-name-title">Kid's Chores</h1>
      <div class="week-days" id="week-stars"></div>
    </div>
    <div id="chores-list" class="chores-list"></div>
    <div id="empty-chores" class="empty-state hidden">
      <p>No chores yet! Go to Manage Kids to add chores.</p>
    </div>
  </div>

  <!-- MANAGE VIEW -->
  <div id="view-manage" class="view">
    <div class="header">
      <button class="btn btn-back" id="btn-back-manage">← Back</button>
      <h1>Manage Kids</h1>
    </div>
    <div class="manage-content">
      <div class="add-kid-form">
        <input type="text" id="new-kid-name" placeholder="Kid's name..." maxlength="20" />
        <button class="btn btn-add" id="btn-add-kid">Add Kid</button>
      </div>
      <div id="manage-kids-list" class="manage-kids-list"></div>
    </div>
  </div>

  <!-- MANAGE KID CHORES VIEW -->
  <div id="view-manage-kid" class="view">
    <div class="header">
      <button class="btn btn-back" id="btn-back-manage-kid">← Back</button>
      <h1 id="manage-kid-title">Manage Chores</h1>
    </div>
    <div class="manage-content">
      <div class="add-kid-form">
        <input type="text" id="new-chore-name" placeholder="Chore name..." maxlength="40" />
        <button class="btn btn-add" id="btn-add-chore">Add Chore</button>
      </div>
      <div id="manage-chores-list" class="manage-chores-list"></div>
    </div>
  </div>

  <!-- STAR CELEBRATION OVERLAY -->
  <div id="star-overlay" class="star-overlay hidden">
    <div class="star-content">
      <div class="big-star">⭐</div>
      <h2>You got a star!</h2>
      <p id="star-kid-name"></p>
      <button class="btn btn-close-star" id="btn-close-star">Woohoo! 🎉</button>
    </div>
    <div id="confetti-container"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
